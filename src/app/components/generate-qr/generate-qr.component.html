<button 
  mat-fab   
  class="btn-close"
  matTooltip="cerrar"
  aria-label="cerrar"
  mat-dialog-close>
  <mat-icon>close</mat-icon>
</button>

<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Generar Etiquetas de Lotes</mat-card-title>
    <mat-card-subtitle></mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    
    <div class="header-actions">
      <mat-form-field class="filtro">
        <mat-label>Filtrar Lotes o Paquetes</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Lote 01, Premium..." #inputt />
      </mat-form-field>

      <div class="formato-container">
        <label class="formato-label">Formato de Salida:</label>
        <mat-radio-group [(ngModel)]="formatoImpresion" color="primary">
          <mat-radio-button value="TERMICO">Impresora Térmica (5x5 cm)</mat-radio-button>
          <mat-radio-button value="A4">Hoja Carta / A4 (Planilla)</mat-radio-button>
        </mat-radio-group>
      </div>

      <button class="btn-generate" mat-raised-button color="primary" (click)="ordenarSeleccionados()" [disabled]="generarActive">
        Generar PDF
      </button>
    </div>

    <mat-progress-bar mode="indeterminate" *ngIf="visibleQR" style="margin-top: 15px;"></mat-progress-bar>

    <!-- Contenedor que controla las dimensiones, centrado y scroll de la tabla -->
    <div class="tabla-container mat-elevation-z8">
      <table mat-table [dataSource]="dataSource">
        
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef> Seleccionar </th>
          <td mat-cell *matCellDef="let row">
            <mat-checkbox
              (click)="$event.stopPropagation(); mapearSeleccionado(row)"
              (change)="$event ? selection.toggle(row) : null"
              [checked]="selection.isSelected(row)">
            </mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="tipoPaquete">
          <th mat-header-cell *matHeaderCellDef>Tipo Paquete</th>
          <td mat-cell *matCellDef="let element">{{ element.tipoPaquete }}</td>
        </ng-container>

        <ng-container matColumnDef="paquete">
          <th mat-header-cell *matHeaderCellDef>ID Paquete (QR)</th>
          <td mat-cell *matCellDef="let element">{{ element.paquete }}</td>
        </ng-container>

        <ng-container matColumnDef="lote">
          <th mat-header-cell *matHeaderCellDef>Lote Vinculado</th>
          <td mat-cell *matCellDef="let element">{{ element.lote }}</td>
        </ng-container>

        <ng-container matColumnDef="creacion">
          <th mat-header-cell *matHeaderCellDef>Creación</th>
          <td mat-cell *matCellDef="let element">{{ element.creacion }}</td>
        </ng-container>

        <!-- Cabecera fija activada con sticky: true -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="selection.toggle(row); mapearSeleccionado(row)"></tr>
      </table>
    </div>

  </mat-card-content>
</mat-card>
